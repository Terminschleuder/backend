name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*", "alpha-*", "*alpha"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The app needs GDAL/GEOS/PROJ (bundled in the image) and PostGIS in the DB.
      # We build the compose stack and run everything inside the containers — no
      # host GIS installs, mirroring the "prod = pull the image" constraint.
      - name: Build images
        run: docker compose build

      - name: System check
        run: docker compose run --rm web python manage.py check

      - name: Migrate
        run: docker compose run --rm web python manage.py migrate --noinput

      - name: Tests
        run: docker compose run --rm web python -m pytest -q

      # Guard against a model change shipping without its migration.
      - name: Migration consistency
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  # Publish the image to ghcr.io only when a commit lands on main (an accepted
  # PR, once main is branch-protected) or when a release tag is pushed. Develop
  # pushes and PRs build/test above but never publish.
  publish:
    name: Build & publish image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write      # for buildx provenance/SLSA attestation
      attestations: write  # to push provenance attestations
      actions: write       # to write the buildx GHA cache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/terminschleuder/backend
          # main push -> :latest + :sha; tag push -> :<tag> + :sha
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=terminschleuder-backend
            org.opencontainers.image.description=Django + DRF + PostGIS backend for the terminschleuder event directory
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build & push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the published image by its registry ref (buildx pushes straight
      # to ghcr without loading into the daemon, so the local imageid isn't
      # scannable; trivy reads the ghcr creds login-action wrote to the docker
      # config). cache: true caches the vuln DB across runs.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          cache: true