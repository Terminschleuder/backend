---
name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*", "alpha-*", "*alpha"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute version + build images, no push/tag/release"
        type: boolean
        default: false

permissions:
  contents: read

# PRs and develop pushes may cancel their in-flight predecessors, but a push to
# main never cancels a running release — it queues behind it (see the job-level
# release-queue group below).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  test:
    name: Build & test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The app needs GDAL/GEOS/PROJ (bundled in the image) and PostGIS in the DB.
      # We build the compose stack and run everything inside the containers — no
      # host GIS installs, mirroring the "prod = pull the image" constraint.
      - name: Build images
        run: docker compose build

      - name: System check
        run: docker compose run --rm web python manage.py check

      - name: Migrate
        run: docker compose run --rm web python manage.py migrate --noinput

      - name: Tests
        run: docker compose run --rm web python -m pytest -q

      # Guard against a model change shipping without its migration.
      - name: Migration consistency
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  # Every accepted change on main (a PR merge or a push) cuts the next CalVer
  # release (YYYY.MINOR.0, e.g. v2026.1.0): it versions, builds & pushes both
  # images (app + PostGIS db) to ghcr.io, scans them, then creates the git tag +
  # GitHub Release last (so a failed re-run recomputes the same version and
  # stays idempotent). PRs and develop pushes build/test above but never release.
  release:
    name: Version, publish images & cut release
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write      # create tag + GitHub Release
      packages: write      # push to ghcr.io
      id-token: write      # for buildx provenance/SLSA attestation
      attestations: write  # to push provenance attestations
      actions: write       # to write the buildx GHA cache
    concurrency:
      group: release-queue
      cancel-in-progress: false   # serialize releases; never kill a publish

    steps:
      # Full history: the version computation must see all remote tags
      # (CalVer tags are created here, not locally).
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute next version (CalVer YYYY.MINOR.0)
        id: version
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          LATEST=$(git tag -l "v${YEAR}.*" | sort -V | tail -n1)
          MINOR=0
          [ -n "$LATEST" ] && MINOR=$(echo "$LATEST" | cut -d. -f2)
          NEXT="${YEAR}.$((MINOR + 1)).0"
          # Idempotent re-run: if the tag already exists on THIS commit (a
          # failed release retried), reuse it rather than skipping a version.
          if git rev-parse -q --verify "refs/tags/v${NEXT}" >/dev/null; then
            if [ "$(git rev-parse "v${NEXT}^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::tag v${NEXT} already exists on a different commit" >&2
              exit 1
            fi
            echo "Reusing existing tag v${NEXT} for this commit (failed-run retry)."
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}"     >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image metadata
        id: meta_app
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/terminschleuder/backend
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=terminschleuder-backend
            org.opencontainers.image.description=Django + DRF + PostGIS backend for the terminschleuder event directory
            org.opencontainers.image.licenses=Apache-2.0

      # The PostGIS db image is published alongside the app image. Pin it by its
      # release version in deployments — `latest` floats with a Postgres major
      # bump and a dump/restore cycle.
      - name: DB image metadata
        id: meta_db
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/terminschleuder/backend-db
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=terminschleuder-backend-db
            org.opencontainers.image.description=PostGIS database image for the terminschleuder backend
            org.opencontainers.image.licenses=Apache-2.0

      # Dry runs (workflow_dispatch with dry_run=true) build but don't push.
      - name: Build & push app image
        id: build_app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          provenance: true
          sbom: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push db image
        id: build_db
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.db
          push: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          provenance: true
          sbom: true
          tags: ${{ steps.meta_db.outputs.tags }}
          labels: ${{ steps.meta_db.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the published images by their registry ref (buildx pushes straight
      # to ghcr without loading into the daemon, so the local imageid isn't
      # scannable; trivy reads the ghcr creds login-action wrote to the docker
      # config). cache: true caches the vuln DB across runs. Skipped on dry
      # runs (the registry ref only exists after a push).
      - name: Trivy scan app image
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta_app.outputs.json).tags[0] }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          cache: true

      # Report-only: the db image is upstream postgres + PostGIS — its CVEs are
      # not ours to patch, so a hit must not block the app release.
      - name: Trivy scan db image (report-only)
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta_db.outputs.json).tags[0] }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 0
          cache: true

      # LAST, deliberately: a failed earlier step re-runs with the same
      # version and re-pushed tags, then cuts the release — never the reverse
      # (a published release with no images). gh is preinstalled on the runner;
      # creating a release for a nonexistent tag also creates the tag at
      # --target, and the API-attached source tarballs publish the source.
      - name: Create tag & GitHub Release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Automated CalVer release $VERSION. Images: ghcr.io/terminschleuder/backend and ghcr.io/terminschleuder/backend-db ($VERSION, latest)." \
            --generate-notes