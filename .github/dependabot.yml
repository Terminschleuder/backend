# Dependabot version updates — weekly PRs, minor/patch bumps grouped per
# ecosystem; major bumps stay individual so breaking changes get their own
# review. (Alerts + security updates are enabled in the repo Security
# settings; this file only controls the proactive PR cadence.)
version: 2
updates:
  # requirements.txt (runtime + test pins).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base image of the app image (Dockerfile). NOTE: Dockerfile.db pins
  # postgres:18 on purpose (a Postgres major bump needs a dump/restore
  # migration) and is NOT auto-updated — Dependabot's docker ecosystem only
  # watches a "Dockerfile" manifest per directory.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]

  # Action pins in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]